<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NGOをつくろう</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#121a20;--sub:#3b4750;--line:#e1dccf;--main:#1f7a6b;--main-d:#155a4f;--warn:#c8553d;--gold:#d9a441;--edu:#4a7fc1;--hlt:#d0617a;--wtr:#2fa4c4}
@media(prefers-color-scheme:dark){:root{--bg:#171c20;--card:#212830;--ink:#f4f7f9;--sub:#cdd6dc;--line:#33404a;--main:#3bb59f;--main-d:#2a8f7d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:4px 0 6px}
.lead{color:var(--ink);font-size:19px;font-weight:700;line-height:1.6;margin-bottom:6px}
.sub{color:var(--sub);font-size:14px}
body{font-size:16px}
.ic{display:inline-block;width:1.5em;text-align:center;margin-right:2px}
.acts button .art{margin:0 0 6px;border:1px solid var(--line)}
.acts button b{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:20px}
.stat span{font-size:13px;color:var(--sub);font-weight:600}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;transition:width .4s}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .name{flex:1;min-width:0}
.row .name small{color:var(--sub);display:block;font-size:13px}
.step{display:flex;align-items:center;gap:6px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px}
button:hover:not(:disabled){border-color:var(--main)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--main);color:#fff;border-color:var(--main);font-weight:bold;padding:10px 18px}
button.pri:hover:not(:disabled){background:var(--main-d)}
.step button{width:32px;padding:4px 0}
.step .n{min-width:22px;text-align:center;font-weight:bold}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.acts button{text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.acts button small{display:block;color:var(--sub);font-size:13px}
.acts button.on{border-color:var(--main);background:rgba(31,122,107,.12)}
#log{max-height:220px;overflow:auto;font-size:14px}
#log p{margin:4px 0;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:14px;max-width:560px;width:100%;padding:20px;max-height:92vh;overflow:auto}
.modal h2{margin:0 0 6px;font-size:18px}
.modal .opts button{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px}
.modal .opts small{display:block;color:var(--sub);font-size:13px}
.learn{font-size:14px;color:var(--sub);border-left:3px solid var(--gold);padding-left:8px;margin-top:10px}
.art{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:10px}
.thumb{width:128px;flex:none}.thumb .art{margin:0}
#tip{border-left:5px solid var(--gold)}#tip p{margin:4px 0 0}
details summary{cursor:pointer;font-weight:bold}
details ul{margin:8px 0 0;padding-left:20px}details li{margin:4px 0}
.gl dt{font-weight:bold;margin-top:8px}.gl dd{margin:2px 0 0 0;color:var(--sub)}
.quiz-ok{color:var(--main-d);font-weight:bold}.quiz-ng{color:var(--warn);font-weight:bold}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;color:#fff;margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>NGOをつくろう</h1>
  <div class="lead">小さな国際協力NGOの代表になって、2年間（24か月）で現地の暮らしを良くしよう。</div>

  <div id="game" style="display:none">
    <div class="card">
      <div id="scene"></div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="card" id="tip"></div>
    <div class="card">
      <b><span class="ic">🗺️</span>活動地域の状況</b>
      <div id="projects"></div>
    </div>
    <div class="card">
      <b><span class="ic">🧑‍💼</span>今月のスタッフ配置</b> <span class="sub" id="free"></span>
      <div id="assign"></div>
    </div>
    <div class="card">
      <b><span class="ic">✨</span>今月の特別な取り組み</b> <span class="sub">（複数選べます）</span>
      <div class="acts" id="acts"></div>
    </div>
    <div style="text-align:center;margin:14px 0"><button class="pri" id="end">今月を終える ▶</button></div>
    <div class="card"><details id="notes"><summary>📓 学びノート（<span id="ncount">0</span>件）</summary><ul id="nlist"></ul></details>
      <details style="margin-top:10px"><summary>📖 用語集</summary><dl class="gl" id="gloss"></dl></details></div>
    <div class="card"><b><span class="ic">📒</span>活動の記録</b><div id="log"></div></div>
  </div>

  <div id="title" class="card">
    <div id="titleArt"></div>
    <p>あなたは、ある国の農村地域で活動を始めたばかりの小さなNGOの代表です。資金・スタッフ・地域との信頼をやりくりしながら、教育・保健・水の3分野を前に進めます。</p>
    <p>目標は、<b>自分たちが去っても続く変化</b>をつくること。お金を使えば成果が出ますが、現地の人たちが主役でなければ、活動は長続きしません。</p>
    <button class="pri" id="start">活動をはじめる</button>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rnd = (a,b) => a + Math.random()*(b-a);
const MAXM = 24;

/* ---------- イラスト（インラインSVG・陰影つき） ---------- */
let UID = 0;
const sc = (inner, o = {}) => {
  const u = 'u' + (++UID), [t, b] = o.sky || ['#5fb0e6', '#d9f0fb'], [g1, g2] = o.ground || ['#a4c972', '#6f9f4e'];
  const hz = o.horizon || 112;
  const tufts = o.indoor ? '' : `<g stroke="#4f7d3a" stroke-width="1.2" opacity=".55" fill="none"><path d="M20 130l2-5 2 5M70 150l2-5 2 5M130 142l2-5 2 5M215 152l2-5 2 5M300 146l2-5 2 5M372 138l2-5 2 5M255 128l2-5 2 5M45 120l2-5 2 5"/></g>`;
  return `<svg class="art" viewBox="0 0 400 160" role="img" aria-hidden="true"><defs>
<linearGradient id="${u}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t}"/><stop offset="1" stop-color="${b}"/></linearGradient>
<linearGradient id="${u}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${g1}"/><stop offset="1" stop-color="${g2}"/></linearGradient>
<radialGradient id="${u}u"><stop offset="0" stop-color="#fff6c8"/><stop offset=".35" stop-color="#ffe27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient></defs>
<rect width="400" height="160" fill="url(#${u}s)"/>
${o.nosun || o.indoor ? '' : `<circle cx="340" cy="32" r="46" fill="url(#${u}u)"/><circle cx="340" cy="32" r="12" fill="#fff6c0"/>`}
${o.indoor ? '' : `<path d="M0 104q40-26 90-12t110-6 120 4 80-8v36H0z" fill="${o.hill || '#8db89a'}" opacity=".65"/><path d="M0 110q60-14 120-4t130 0 150-6v32H0z" fill="${o.hill2 || '#79a888'}" opacity=".9"/>`}
<rect y="${hz}" width="400" height="${160 - hz}" fill="url(#${u}g)"/>${tufts}${inner}</svg>`;
};
const cl = (x, y, c = '#fff', s = 1) => `<g fill="${c}" transform="translate(${x} ${y}) scale(${s})" opacity=".95"><ellipse rx="26" ry="8"/><ellipse cx="14" cy="-6" rx="16" ry="9"/><ellipse cx="-12" cy="-5" rx="12" ry="7"/></g>`;
const person = (x, y, c = '#d0617a', s = 1, o = {}) => {
  const skin = o.skin || '#8a5a3c', hair = o.hair || '#241610', pants = o.pants || '#3d4352';
  return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cy="15" rx="10" ry="2.6" fill="#000" opacity=".22"/>
<rect x="-5" y="3" width="4.4" height="12" rx="1.5" fill="${pants}"/><rect x="0.6" y="3" width="4.4" height="12" rx="1.5" fill="${pants}"/>
<rect x="-5.5" y="13" width="5.5" height="2.4" rx="1" fill="#222"/><rect x="0.5" y="13" width="5.5" height="2.4" rx="1" fill="#222"/>
<path d="M-7 -14q7-4 14 0l2 19h-18z" fill="${c}"/><path d="M1 -15q6 0 8 3l2 17h-10z" fill="#000" opacity=".14"/>
${o.vest ? '<path d="M-7 -14l5 1v18h-8z" fill="#f08a2c"/><path d="M7 -14l-5 1v18h8z" fill="#f08a2c"/><path d="M-6 -2h12" stroke="#fff" stroke-width="1" opacity=".8"/>' : ''}
<rect x="-10.5" y="-13" width="4" height="13" rx="2" fill="${skin}" transform="rotate(8 -8 -13)"/><rect x="6.5" y="-13" width="4" height="13" rx="2" fill="${skin}" transform="rotate(-8 8 -13)"/>
<rect x="-2" y="-19" width="4" height="5" fill="${skin}"/><circle cy="-24" r="6.2" fill="${skin}"/><circle cx="3" cy="-23" r="5" fill="#000" opacity=".08"/>
<path d="M-6.6 -24.5q.6-7.5 6.6-7.5t6.6 7.5q-3-3.4-6.6-3.4t-6.6 3.4z" fill="${hair}"/>
<circle cx="-2.2" cy="-23.5" r=".8" fill="#1b1b1b"/><circle cx="2.2" cy="-23.5" r=".8" fill="#1b1b1b"/><path d="M-1.6 -21q1.6 1.2 3.2 0" stroke="#5a2a1a" stroke-width=".7" fill="none"/>
${o.hat ? `<path d="M-8 -29h16l-2-4h-12z" fill="${o.hat}"/>` : ''}${o.scarf ? `<path d="M-7 -29q7-7 14 0l-1 3q-6-4-12 0z" fill="${o.scarf}"/>` : ''}${o.extra || ''}</g>`;
};
const kid = (x, y, c, o) => person(x, y, c, .62, o);
const house = (x, y, wall = '#e6c79c', roof = '#b5543a', s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cy="1" rx="30" ry="3" fill="#000" opacity=".2"/><rect x="-22" y="-27" width="44" height="27" fill="${wall}"/><rect x="8" y="-27" width="14" height="27" fill="#000" opacity=".12"/><rect x="-22" y="-4" width="44" height="4" fill="#000" opacity=".12"/><path d="M-28 -27l28-19 28 19z" fill="${roof}"/><path d="M0 -46l28 19h-12z" fill="#000" opacity=".15"/><path d="M-22 -33h44M-14 -39h28" stroke="#000" stroke-opacity=".15"/><rect x="-5" y="-17" width="10" height="17" rx="1" fill="#6e4328"/><circle cx="3" cy="-8" r=".9" fill="#e8c46a"/><rect x="-18" y="-21" width="8" height="8" fill="#a9d6ee" stroke="#6e4328"/><path d="M-14 -21v8M-18 -17h8" stroke="#6e4328" stroke-width=".8"/><rect x="11" y="-21" width="8" height="8" fill="#a9d6ee" stroke="#6e4328"/></g>`;
const school = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cy="1" rx="46" ry="3.5" fill="#000" opacity=".2"/><rect x="-38" y="-32" width="76" height="32" fill="#f3e6c6"/><rect x="16" y="-32" width="22" height="32" fill="#000" opacity=".1"/><rect x="-38" y="-5" width="76" height="5" fill="#b9a67e"/><path d="M-43 -32l43-16 43 16z" fill="#3f73b4"/><path d="M0 -48l43 16h-14z" fill="#000" opacity=".15"/><rect x="-31" y="-25" width="12" height="11" fill="#a9d6ee" stroke="#7a5a3a"/><path d="M-25 -25v11M-31 -19.5h12" stroke="#7a5a3a" stroke-width=".7"/><rect x="19" y="-25" width="12" height="11" fill="#a9d6ee" stroke="#7a5a3a"/><rect x="-6" y="-19" width="12" height="19" fill="#6e4328"/><path d="M-9 0h18l2 3h-22z" fill="#cdbd98"/><rect x="-14" y="-31" width="28" height="7" rx="1" fill="#fff"/><text y="-25.6" font-size="5.6" text-anchor="middle" fill="#3f73b4" font-weight="bold">SCHOOL</text><path d="M0 -48v-22" stroke="#666" stroke-width="1.6"/><path d="M0 -70h14l-4 4 4 4h-14z" fill="#d0463a"/></g>`;
const clinic = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cy="1" rx="38" ry="3" fill="#000" opacity=".2"/><rect x="-32" y="-30" width="64" height="30" fill="#fbfbf8"/><rect x="14" y="-30" width="18" height="30" fill="#000" opacity=".08"/><rect x="-34" y="-34" width="68" height="6" fill="#cf4d63"/><rect x="-9" y="-54" width="18" height="18" rx="2" fill="#fff" stroke="#cf4d63"/><rect x="-2" y="-51" width="4" height="12" fill="#cf4d63"/><rect x="-6" y="-47" width="12" height="4" fill="#cf4d63"/><rect x="-25" y="-22" width="11" height="10" fill="#a9d6ee" stroke="#aaa"/><rect x="14" y="-22" width="11" height="10" fill="#a9d6ee" stroke="#aaa"/><rect x="-6" y="-17" width="12" height="17" fill="#8fc4dc" stroke="#aaa"/><path d="M-6 -17h12" stroke="#fff" stroke-width=".6"/></g>`;
const well = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cy="1" rx="20" ry="3" fill="#000" opacity=".22"/><path d="M-14 -16h28v16h-28z" fill="#a39482"/><path d="M-14 -11h28M-14 -6h28M-5 -16v5M5 -11v5M-2 -6v6" stroke="#7d7060" stroke-width=".8"/><rect x="-14" y="-3" width="28" height="3" fill="#000" opacity=".12"/><ellipse cy="-16" rx="14" ry="3" fill="#2f86a8"/><rect x="-15" y="-34" width="3" height="19" fill="#6b4a30"/><rect x="12" y="-34" width="3" height="19" fill="#6b4a30"/><path d="M-19 -33l19-11 19 11z" fill="#8a5a36"/><path d="M0 -33v14" stroke="#555" stroke-width=".8"/><path d="M-3 -19h6l-1 5h-4z" fill="#b5651d"/></g>`;
const tree = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cy="1" rx="22" ry="3" fill="#000" opacity=".2"/><path d="M-3 0q1-18-2-26l3-2q0 10 2 28z" fill="#6e4a2a"/><path d="M2 -20q8-8 14-12" stroke="#6e4a2a" stroke-width="3" fill="none"/><ellipse cy="-36" rx="28" ry="9" fill="#3d8a4c"/><ellipse cx="-6" cy="-39" rx="20" ry="6" fill="#52a35e"/><ellipse cx="14" cy="-31" rx="14" ry="5" fill="#2f7340"/></g>`;
const can = (x, y, c = '#e0b31f') => `<g transform="translate(${x} ${y})"><rect x="-4" y="-9" width="8" height="9" rx="1" fill="${c}"/><rect x="-2" y="-12" width="4" height="3" fill="#8a6a10"/><path d="M-4 -6h8" stroke="#000" stroke-opacity=".2"/></g>`;
const crops = (x, y, n = 6) => Array.from({ length: n }, (_, i) => `<g transform="translate(${x + i * 9} ${y})" stroke="#3a7a2e" stroke-width="1.4" fill="none"><path d="M0 0q-3-6-5-8M0 0q0-8 0-10M0 0q3-6 5-8"/></g>`).join('');
const rain = n => `<g stroke="#d4eaff" stroke-width="1.4" opacity=".8">${Array.from({ length: n }, (_, i) => `<path d="M${(i * 19 + 5) % 400} ${(i * 37) % 110 + 20}l-4 11"/>`).join('')}</g>`;
const desk = (x, y, w = 40) => `<g transform="translate(${x} ${y})"><rect width="${w}" height="5" fill="#a67a4e"/><rect y="5" width="${w}" height="2" fill="#6e4a2a"/><rect x="3" y="7" width="3" height="14" fill="#6e4a2a"/><rect x="${w - 6}" y="7" width="3" height="14" fill="#6e4a2a"/></g>`;
const FLOOR = { indoor: true, nosun: true, horizon: 118, ground: ['#b89c78', '#8d7556'] };
const wall = (c = '#efe6d2') => `<rect width="400" height="118" fill="${c}"/><rect y="108" width="400" height="10" fill="#000" opacity=".08"/>`;

const ART = {
  title: () => sc(tree(30, 124, 1.1) + tree(380, 128, .9) + school(105, 124) + clinic(200, 124) + well(282, 126) + house(350, 124, '#e6c79c', '#a8573a', .85)
    + `<path d="M120 160q40-18 90-34h30q-30 22-50 34z" fill="#c9a877" opacity=".6"/>`
    + person(150, 140, '#3f73b4', 1, { vest: 1 }) + person(232, 142, '#d0617a', 1, { skin: '#7a4a2c', scarf: '#e0a030' }) + can(250, 156) + kid(180, 146, '#e0a030') + kid(205, 148, '#4a9a6a') + kid(305, 146, '#d0617a') + crops(310, 156, 4)),
  flood: () => sc(rain(26) + cl(60, 24, '#5d6a74', 1.3) + cl(200, 18, '#56626c', 1.4) + cl(330, 28, '#5d6a74', 1.2)
    + clinic(95, 124) + house(310, 122) + `<rect y="124" width="400" height="36" fill="#7f9fb0" opacity=".88"/><path d="M0 132q25-6 50 0t50 0 50 0 50 0 50 0 50 0 50 0 50 0M0 146q25-6 50 0t50 0 50 0 50 0 50 0 50 0 50 0 50 0" stroke="#dff1ff" fill="none" opacity=".7"/>`
    + `<path d="M160 118h50" stroke="#7a5a3a" stroke-width="5" stroke-dasharray="10 8"/>` + person(200, 128, '#3f73b4', .95, { vest: 1, extra: '<rect x="-9" y="-30" width="18" height="3" fill="#f08a2c"/>' }) + `<rect x="170" y="136" width="46" height="9" rx="4" fill="#c8553d"/><rect x="170" y="140" width="46" height="5" fill="#000" opacity=".15"/>`,
    { sky: ['#6d7b86', '#b9c4cb'], nosun: true, ground: ['#7f9a68', '#5f7a4e'], hill: '#7d8f92', hill2: '#6b807f' }),
  donor: () => sc(school(95, 126) + tree(360, 126, .9)
    + `<rect x="168" y="62" width="82" height="42" rx="3" fill="#fff" stroke="#8a8a8a" stroke-width="2"/><rect x="172" y="66" width="22" height="22" rx="4" fill="#c0392b"/><path d="M178 78l5 5 8-9" stroke="#fff" stroke-width="3" fill="none"/><text x="222" y="80" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold">COMPANY</text><text x="222" y="97" font-size="8" text-anchor="middle" fill="#555">Supported by</text><rect x="204" y="104" width="4" height="26" fill="#6e4a2a"/><rect x="233" y="104" width="4" height="26" fill="#6e4a2a" transform="translate(-14 0)"/>`
    + person(285, 138, '#27384f', 1.05, { skin: '#d9a982', hair: '#222', pants: '#1c2535', extra: '<rect x="8" y="2" width="12" height="9" rx="1" fill="#6e4a2a"/>' })
    + `<g transform="translate(330 112)"><rect width="52" height="28" rx="3" fill="#f6e7b3" stroke="#c9a640" stroke-width="1.5"/><text x="26" y="19" font-size="13" text-anchor="middle" fill="#7a5a08" font-weight="bold">200万円</text></g>` + person(145, 142, '#3f73b4', 1, { vest: 1 }) + kid(170, 148, '#d0617a')),
  corrupt: () => sc(wall('#e9dfc8') + `<rect x="30" y="22" width="86" height="56" fill="#cfe4ef" stroke="#8a7a60" stroke-width="3"/><path d="M73 22v56M30 50h86" stroke="#8a7a60" stroke-width="2"/><rect x="290" y="30" width="70" height="46" fill="#fff" stroke="#999"/><text x="325" y="58" font-size="10" text-anchor="middle" fill="#555">許可証</text>`
    + desk(130, 110, 150) + `<rect x="190" y="104" width="38" height="6" fill="#fff" stroke="#bbb"/><rect x="228" y="100" width="22" height="10" fill="#f6efe0" stroke="#aaa"/><path d="M228 100l11 6 11-6" stroke="#aaa" fill="none"/>`

function addNote(t){ if(t && !G.notes.includes(t)) G.notes.push(t); }
function pickTip(){
  const cand = TIPS.filter(x=>x.c(G) && !G.tipsSeen.includes(x.t));
  let t;
  if(cand.length) t = cand[0].t;
  else {
    const rest = GENERIC_TIPS.filter(x=>!G.tipsSeen.includes(x));
    const pool = rest.length ? rest : GENERIC_TIPS;
    t = pool[Math.floor(Math.random()*pool.length)];
  }
  G.tipsSeen.push(t); G.tip = t; addNote(t);
}
function showQuiz(){
  const q = QUIZ[G.qi++];
  showModal('<h2>🧠 学びチェック（'+G.qi+'/'+QUIZ.length+'）</h2><p>'+q.q+'</p><div class="opts">'+q.o.map((t,i)=>'<button data-i="'+i+'">'+t+'</button>').join('')+'</div>');
  $('#box').onclick = e=>{
    const b=e.target.closest('button[data-i]'); if(!b) return;
    const ok = +b.dataset.i===q.a; if(ok){ G.qOk++; G.trust+=2; }
    addNote(q.why);
    showModal('<h2>'+(ok?'<span class="quiz-ok">⭕ 正解！</span>':'<span class="quiz-ng">❌ 残念</span>')+'</h2><p>正解：'+q.o[q.a]+'</p><div class="learn">💡 '+q.why+'</div>'+(ok?'<p class="sub">学びを現場に活かし、地域の信頼 +2</p>':'')+'<div style="margin-top:14px;text-align:right"><button class="pri" id="qok">続ける</button></div>');
    $('#box').onclick = e2=>{ if(e2.target.id==='qok'){ hideModal(); render(); } };
    render();
  };
}

const G = {
  m:1, funds:300, staff:6, trust:50, sup:50, morale:70, own:10, people:0,
  prog:{edu:10,hlt:10,wtr:10}, asg:{edu:2,hlt:2,wtr:1,fund:1},
  picked:{}, hired:false, used:[], over:false, notes:[], qi:0, qOk:0, tip:null, tipsSeen:[],
  say(t){ this.logs.unshift(`${this.m}か月目：${t}`); },
  logs:[]
};
G.say = function(t){ const p=document.createElement('p'); p.textContent=`${this.m}か月目：${t}`; $('#log').prepend(p); };

const SAL = 12;      // 1人あたり人件費（万円/月）
const FIELD = 6;     // 現場活動費（万円/人）
function used(){ return G.asg.edu+G.asg.hlt+G.asg.wtr+G.asg.fund; }
function cost(){ return G.staff*SAL + (G.asg.edu+G.asg.hlt+G.asg.wtr)*FIELD
  + ACTIONS.filter(a=>G.picked[a.id]).reduce((s,a)=>s+a.cost,0); }

function bar(v,c){ return `<div class="bar"><i style="width:${clamp(v,0,100)}%;background:${c}"></i></div>`; }
function render(){
  G.trust=clamp(G.trust,0,100); G.sup=clamp(G.sup,0,100); G.morale=clamp(G.morale,0,100); G.own=clamp(G.own,0,100);
  AREAS.forEach(a=>G.prog[a.id]=clamp(G.prog[a.id],0,100));
  $('#scene').innerHTML = sceneArt();
  $('#tip').innerHTML = G.tip ? '<b>💡 今月の学びのヒント</b><p>'+G.tip+'</p>' : '';
  $('#ncount').textContent = G.notes.length;
  $('#nlist').innerHTML = G.notes.map(n=>'<li>'+n+'</li>').join('');
  $('#stats').innerHTML = `
    <div class="stat"><span><span class="ic">📅</span>経過</span><b>${G.m} / ${MAXM}か月</b></div>
    <div class="stat"><span><span class="ic">💰</span>資金</span><b style="color:${G.funds<100?'var(--warn)':'inherit'}">${Math.round(G.funds)}万円</b></div>
    <div class="stat"><span><span class="ic">👥</span>スタッフ</span><b>${G.staff}人</b></div>
    <div class="stat"><span><span class="ic">🤝</span>地域の信頼</span><b>${Math.round(G.trust)}</b>${bar(G.trust,'var(--main)')}</div>
    <div class="stat"><span><span class="ic">📣</span>支援者の数</span><b>${Math.round(G.sup)}</b>${bar(G.sup,'var(--gold)')}</div>
    <div class="stat"><span><span class="ic">💪</span>スタッフの元気</span><b>${Math.round(G.morale)}</b>${bar(G.morale,G.morale<30?'var(--warn)':'var(--main)')}</div>
    <div class="stat"><span><span class="ic">🌱</span>地域の自立度</span><b>${Math.round(G.own)}</b>${bar(G.own,'var(--edu)')}</div>
    <div class="stat"><span><span class="ic">🧑‍🤝‍🧑</span>支援を受けた人</span><b>${G.people.toLocaleString()}人</b></div>`;
  $('#projects').innerHTML = AREAS.map(a=>`<div class="row"><div class="thumb">${areaArt(a.id)}</div><div class="name"><span class="tag" style="background:${a.color}">${a.icon} ${a.name}</span> <b>${Math.round(G.prog[a.id])}%</b><small>${a.desc}</small>${bar(G.prog[a.id],a.color)}</div></div>`).join('');
  const rows = [...AREAS.map(a=>({id:a.id,icon:a.icon,name:a.name,desc:'現場で活動（1人 現場費'+FIELD+'万円）'})), {id:'fund',icon:'💼',name:'資金調達・事務',desc:'寄付集め・助成金申請・経理'}];
  $('#assign').innerHTML = rows.map(r=>`<div class="row"><div class="name"><span class="ic">${r.icon}</span><b>${r.name}</b><small>${r.desc}</small></div>
    <div class="step"><button data-d="-1" data-id="${r.id}" ${G.asg[r.id]<=0?'disabled':''}>−</button><span class="n">${G.asg[r.id]}</span><button data-d="1" data-id="${r.id}" ${used()>=G.staff?'disabled':''}>＋</button></div></div>`).join('');
  $('#free').textContent = `（配置 ${used()} / ${G.staff}人）`;
  $('#acts').innerHTML = ACTIONS.map(a=>{
    const dis = a.once && G.hired;
    return `<button data-act="${a.id}" class="${G.picked[a.id]?'on':''}" ${dis?'disabled':''}>${actArt(a.id)}<span><span class="ic">${a.icon}</span><b>${a.name}（${a.cost}万円）</b></span><small>${a.desc}</small></button>`;
  }).join('');
  $('#end').textContent = `今月を終える ▶（支出 約${cost()}万円）`;
}

$('#assign').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  const id=b.dataset.id, d=+b.dataset.d;
  if(d>0 && used()>=G.staff) return;
  if(d<0 && G.asg[id]<=0) return;
  G.asg[id]+=d; render();
});
$('#acts').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  G.picked[b.dataset.act] = !G.picked[b.dataset.act]; render();
});

function showModal(html){ $('#box').innerHTML=html; $('#modal').classList.add('show'); }
function hideModal(){ $('#modal').classList.remove('show'); }

function endTurn(){
  if(G.over) return;
  if(used()===0){ alert('スタッフを1人以上配置してください。'); return; }
  // 特別な取り組み
  ACTIONS.forEach(a=>{ if(G.picked[a.id]){ a.fn(G); if(a.once) G.hired=true; } });
  const hiredNow = G.picked.hire;
  // 支出
  G.funds -= cost();
  // 資金調達
  const raised = Math.round(G.asg.fund*26*rnd(.8,1.3) + G.sup*1.5*rnd(.8,1.2));
  G.funds += raised;
  // 現場の成果（地域の信頼が高いほど効果的）
  let gainTotal=0;
  const eff = .5 + G.trust/100 + (G.morale<30?-.3:0);
  AREAS.forEach(a=>{
    const n = G.asg[a.id];
    // 自立度が高いほど、スタッフがいなくても活動が維持される
    const decay = n===0 ? Math.max(0, 3 - G.own/20) : Math.max(0, 1 - G.own/60);
    const gain = n*3.2*eff*rnd(.85,1.15) - decay;
    G.prog[a.id] += gain; gainTotal += Math.max(0,gain);
  });
  const helped = Math.round(gainTotal*14);
  G.people += helped;
  G.say(`寄付・助成で${raised}万円を調達。活動により${helped}人に新たに支援が届いた。`);
  // 自然変化
  G.morale -= 5 + (used()>G.staff-1?2:0);
  G.trust += (G.asg.edu+G.asg.hlt+G.asg.wtr>=3?1:-1);
  G.own += .5;
  G.sup -= 1;
  G.picked = {};
  if(G.morale<20 && G.staff>2){ G.staff--; shrinkAssign(); G.say('疲れが限界に達し、スタッフが1人辞めてしまった…。'); G.morale+=15; }
  if(G.funds<0){ finish('資金ショート'); return; }
  // イベント
  const pool = EVENTS.filter(e=>!G.used.includes(e.id));
  if(pool.length && Math.random()<.65 && G.m<MAXM){
    const ev = pool[Math.floor(Math.random()*pool.length)];
    G.used.push(ev.id);
    showEvent(ev);
  } else nextMonth();
  render();
}
function shrinkAssign(){
  while(used()>G.staff){
    for(const k of ['fund','wtr','hlt','edu']) if(G.asg[k]>0 && used()>G.staff) G.asg[k]--;
  }
}
function showEvent(ev){
  showModal(`${art(ev.id)}<h2>${ev.title}</h2><p>${ev.text}</p><div class="opts">${ev.opts.map((o,i)=>`<button data-i="${i}">${o.t}<small>${o.s}</small></button>`).join('')}</div>`);
  $('#box').onclick = e=>{
    const b=e.target.closest('button[data-i]'); if(!b) return;
    ev.opts[+b.dataset.i].fn(G);
    addNote(ev.learn);
    showModal(`${art(ev.id)}<h2>${ev.title}</h2><p>${ev.opts[+b.dataset.i].t} を選びました。</p><div class="learn">💡 ${ev.learn}</div><div style="margin-top:14px;text-align:right"><button class="pri" id="ok">次へ</button></div>`);
    $('#box').onclick = e2=>{ if(e2.target.id==='ok'){ hideModal(); if(G.funds<0){finish('資金ショート');return;} nextMonth(); render(); } };
    render();
  };
}
function nextMonth(){
  G.m++;
  if(G.m>MAXM){ finish(); return; }
  pickTip();
  render();
  if(G.qi<QUIZ.length && [5,9,13,17,21].includes(G.m)) showQuiz();
}

function finish(reason){
  G.over=true;
  const avg = (G.prog.edu+G.prog.hlt+G.prog.wtr)/3;
  const score = Math.round(avg*0.35 + G.own*0.3 + G.trust*0.2 + Math.min(100,G.people/60)*0.15);
  let rank, msg;
  if(reason){ rank='活動停止'; msg='資金が尽き、活動を続けられなくなりました。お金の流れを見通す力もNGO運営には欠かせません。'; }
  else if(score>=70){ rank='S：持続的な変化をつくった'; msg='地域の人々が主役となり、あなたが去っても続く仕組みが根づきました。理想的な国際協力です。'; }
  else if(score>=55){ rank='A：確かな成果を残した'; msg='多くの人の暮らしが良くなりました。次は「自立」をさらに意識すると、変化が長続きします。'; }
  else if(score>=40){ rank='B：道半ば'; msg='成果は出ましたが、支援が止まると元に戻る不安が残ります。地域との対話を増やしましょう。'; }
  else { rank='C：課題が多く残った'; msg='活動を通じて多くを学びました。信頼と自立、資金のバランスを見直してみましょう。'; }
  showModal(`${art(reason||score<40?'end_bad':score>=70?'end_good':'end_mid')}<h2>${reason?'ゲームオーバー：'+reason:'2年間の活動が終了しました'}</h2>
    <p><b>評価：${rank}</b>（スコア ${score}）</p><p>${msg}</p>
    <p class="sub">教育 ${Math.round(G.prog.edu)}% ／ 保健 ${Math.round(G.prog.hlt)}% ／ 水・衛生 ${Math.round(G.prog.wtr)}%<br>
    支援を受けた人 ${G.people.toLocaleString()}人 ／ 地域の信頼 ${Math.round(G.trust)} ／ 自立度 ${Math.round(G.own)}</p>
    <p><b>📓 あなたが学んだこと（${G.notes.length}件）</b>　学びチェック ${G.qOk} / ${G.qi} 問正解</p><details><summary>学びノートを見る</summary><ul>${G.notes.map(n=>'<li>'+n+'</li>').join('')}</ul></details>
    <div class="learn">💡 国際協力で大切なのは、支援した人数だけではなく、現地の人が自分たちで続けられる力をどれだけ育てられたかです。</div>
    <div style="margin-top:14px;text-align:right"><button class="pri" onclick="location.reload()">もう一度遊ぶ</button></div>`);
  $('#box').onclick=null;
}

$('#titleArt').innerHTML = art('title');
$('#end').onclick = endTurn;
$('#start').onclick = ()=>{ $('#title').style.display='none'; $('#game').style.display='block'; G.say('NGOの活動がはじまった。'); pickTip(); render(); };
$('#gloss').innerHTML = GLOSS.map(g=>'<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd>').join('');
</script>
</body>
</html>
